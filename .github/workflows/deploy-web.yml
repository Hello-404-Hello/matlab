name: Deploy MATLAB homework website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "!web/download-counts.md"
      - "!web/download-counts-round2.md"
      - "第一轮作业题/*.m"
      - "第一轮作业题/餐盘.jpg"
      - "第一轮作业题/A*.png"
      - "第一轮作业题/碱基对.txt"
      - "第一轮作业题/手机号.xlsx"
      - "第二轮作业题/*.m"
      - "第二轮作业题/*.mlapp"
      - "第二轮作业题/打包应用/**"
      - "第二轮作业题/*.xlsx"
      - "第二轮作业题/ps.jpg"
      - ".github/workflows/deploy-web.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build static website
        run: python3 web/build_site.py
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
