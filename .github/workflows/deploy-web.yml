name: Deploy MATLAB homework website

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "!web/download-counts.md"
      - "第一轮作业题/*.m"
      - "第一轮作业题/餐盘.jpg"
      - "第一轮作业题/碱基对.txt"
      - "第一轮作业题/手机号.xlsx"
      - ".github/workflows/deploy-web.yml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build static website
        run: python3 web/build_site.py
      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: web/dist
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
